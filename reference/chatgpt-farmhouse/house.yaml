  interior_wall_thickness: '4 1/2"'
  first_floor_wall_height: "10'"
  second_floor_wall_height: "9'"
  floor_system_depth: '16"'
  second_floor_elevation: "11' 4\""
  door_height: "6' 8\""
  window_head_height: "8'"

footprints:
  first_floor_main: {x1: "0'", y1: "0'", x2: "60'", y2: "40'"}
