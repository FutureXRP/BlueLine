  name: Reproducible Two-Story Farmhouse
  geometry_version: 1.0.0
  unit_resolution: 1/8 inch
  coordinate_convention: "Origin is southwest outside corner of main first-floor footprint; +X east, +Y north, +Z up. Exterior footprint dimensions are reference-face dimensions."

standards:
